<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients | Hospital Management System</title>

    <link rel="stylesheet" href="../css/patients.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-hospital"></i>

            <h2>Hospital<br>Management</h2>

        </div>

        <ul>

            <li>
                <a href="../index.html">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
            </li>

            <li class="active">
                <a href="patients.html">
                    <i class="fa-solid fa-user-injured"></i>
                    Patients
                </a>
            </li>

            <li>
                <a href="doctors.html">
                    <i class="fa-solid fa-user-doctor"></i>
                    Doctors
                </a>
            </li>
                        <li>
                <a href="departments.html">
                    <i class="fa-solid fa-building"></i>
                    Departments
                </a>
            </li>

            <li>
                <a href="appointments.html">
                    <i class="fa-solid fa-calendar-check"></i>
                    Appointments
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->
    <main class="main-content">

        <!-- Header -->
        <header class="header">

            <div>

                <h1>Patients</h1>

                <p>Hospital Management System / Patients</p>

            </div>

            <div class="profile">

                <i class="fa-solid fa-bell"></i>

                <div class="admin">

                    <i class="fa-solid fa-circle-user"></i>

                    <span>Admin</span>

                </div>

            </div>

        </header>

        <!-- Patient Card -->
        <section class="patient-card">
                        <!-- Top Bar -->
            <div class="top-bar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                        type="text"
                        id="searchPatient"
                        placeholder="Search by Name or Public ID">

                </div>

                <div class="filter">

                    <i class="fa-solid fa-filter"></i>

                    <select id="genderFilter">

                        <option value="ALL">All Patients</option>
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>

                    </select>

                </div>

                <button
                    id="addPatientBtn"
                    class="add-btn">

                    <i class="fa-solid fa-plus"></i>

                    Add Patient

                </button>

            </div>

            <!-- Patient Table -->
            <div class="table-container">

                <table>

                    <thead>
                                                <tr>

                            <th>Public ID</th>
                            <th>Name</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Email</th>
                            <th>Blood Group</th>
                            <th>Actions</th>

                        </tr>

                    </thead>

                    <tbody id="patientTableBody">

                        <!-- Data loaded by JavaScript -->

                    </tbody>

                </table>

            </div>

            <div class="table-footer">

                <p id="patientCount">
                    Showing 0 Patients
                </p>

                <div class="pagination">

                    <button class="page-btn">
                        <i class="fa-solid fa-angle-left"></i>
                    </button>

                    <button class="page-btn active">1</button>

                    <button class="page-btn">
                        <i class="fa-solid fa-angle-right"></i>
                    </button>

                </div>

            </div>

        </section>
            </main>

</div>

<!-- Patient Modal -->
<div class="modal" id="patientModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">Add Patient</h2>

            <button
                class="close-btn"
                id="closeModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form id="patientForm">

            <input
                type="hidden"
                id="patientPublicId">

            <div class="form-group">

                <label for="patientName">
                    Patient Name
                </label>

                <input
                    type="text"
                    id="patientName"
                    placeholder="Enter patient name"
                    required>

            </div>

            <div class="form-group">

                <label for="patientEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="patientEmail"
                    placeholder="Enter email"
                    required>
                                <div class="form-group">

                <label for="patientBirthDate">
                    Birth Date
                </label>

                <input
                    type="date"
                    id="patientBirthDate"
                    required>

            </div>

            <div class="form-group">

                <label for="patientGender">
                    Gender
                </label>

                <select id="patientGender" required>

                    <option value="MALE">Male</option>
                    <option value="FEMALE">Female</option>

                </select>

            </div>

            <div class="form-group">

                <label for="patientBloodGroup">
                    Blood Group
                </label>

                <select id="patientBloodGroup" required>

                    <option value="A_POSITIVE">A+</option>
                    <option value="A_NEGATIVE">A-</option>
                    <option value="B_POSITIVE">B+</option>
                    <option value="B_NEGATIVE">B-</option>
                    <option value="AB_POSITIVE">AB+</option>
                    <option value="AB_NEGATIVE">AB-</option>
                    <option value="O_POSITIVE">O+</option>
                    <option value="O_NEGATIVE">O-</option>

                </select>

            </div>
                        <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    id="cancelBtn">

                    Cancel

                </button>

                <button
                    type="submit"
                    class="btn btn-primary"
                    id="savePatientBtn">

                    Save Patient

                </button>

            </div>

        </form>

    </div>

</div>

<!-- JavaScript -->
<script src="../js/patients.js"></script>

</body>

</html>
