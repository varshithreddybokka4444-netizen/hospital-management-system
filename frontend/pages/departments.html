<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Departments | Hospital Management System</title>

    <link rel="stylesheet" href="../css/departments.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-hospital"></i>

            <h2>Hospital<br>Management</h2>

        </div>

        <ul>

<!--            <li>-->

<!--                <a href="dashboard.html">-->

<!--                    <i class="fa-solid fa-house"></i>-->

<!--                    Dashboard-->

<!--                </a>-->

<!--            </li>-->

            <li>
                <a href="../index.html">
                    <i class="fa-solid fa-house"></i>
                    Home
                </a>
            </li>

            <li>
                <a href="patients.html">
                    <i class="fa-solid fa-house"></i>
                    Patients
                </a>
            </li>




            <li>

                <a href="doctors.html">

                    <i class="fa-solid fa-user-doctor"></i>

                    Doctors

                </a>

            </li>

            <li class="active">

                <a href="departments.html">

                    <i class="fa-solid fa-building"></i>

                    Departments

                </a>

            </li>

            <li>

                <a href="appointments.html">

                    <i class="fa-solid fa-calendar-check"></i>

                    Appointments

                </a>

            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Header -->

        <header class="header">

            <div>

                <h1>Departments</h1>

                <p>Hospital Management System / Departments</p>

            </div>

            <div class="profile">

                <i class="fa-solid fa-bell"></i>

                <div class="admin">

                    <i class="fa-solid fa-circle-user"></i>

                    <span>Admin</span>

                </div>

            </div>

        </header>

        <!-- Department Card -->

        <section class="patient-card">

            <!-- Top Bar -->

            <div class="top-bar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                            type="text"
                            id="searchDepartment"
                            placeholder="Search by Name or Public ID">

                </div>

                <button
                        id="addDepartmentBtn"
                        class="add-btn">

                    <i class="fa-solid fa-plus"></i>

                    Add Department

                </button>

            </div>

            <!-- Table -->

            <div class="table-container">

                <table>

                    <thead>

                    <tr>

                        <th>Public ID</th>

                        <th>Department</th>

                        <th>Head Doctor</th>

                        <th>Specialisation</th>

                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody id="departmentTableBody">

                    <!-- Loaded by JavaScript -->

                    </tbody>

                </table>

            </div>

            <div class="table-footer">

                <p id="departmentCount">

                    Showing 0 Departments

                </p>

                <div class="pagination">

                    <button class="page-btn">

                        <i class="fa-solid fa-angle-left"></i>

                    </button>

                    <button class="page-btn active">

                        1

                    </button>

                    <button class="page-btn">

                        <i class="fa-solid fa-angle-right"></i>

                    </button>

                </div>

            </div>

        </section>

    </main>

</div>
<!-- Department Modal -->
<div class="modal" id="departmentModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">Add Department</h2>

            <button
                    class="close-btn"
                    id="closeModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form id="departmentForm">

            <input
                    type="hidden"
                    id="departmentPublicId">

            <div class="form-group">

                <label for="departmentName">

                    Department Name

                </label>

                <input
                        type="text"
                        id="departmentName"
                        placeholder="Enter department name"
                        required>

            </div>

<!--            <div class="form-group">-->

<!--                <label for="headDoctorPublicId">-->

<!--                    Head Doctor Public ID-->

<!--                </label>-->

<!--                <input-->
<!--                        type="text"-->
<!--                        id="headDoctorPublicId"-->
<!--                        placeholder="Enter head doctor public ID"-->
<!--                        >-->

<!--            </div>-->

            <div class="modal-footer">

                <button
                        type="button"
                        class="btn btn-secondary"
                        id="cancelBtn">

                    Cancel

                </button>

                <button
                        type="submit"
                        class="btn btn-primary"
                        id="saveDepartmentBtn">

                    Save Department

                </button>

            </div>

        </form>

    </div>

</div>




<div class="modal" id="assignHeadDoctorModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Assign Head Doctor</h2>

            <button
                    class="close-btn"
                    id="closeAssignModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form id="assignHeadDoctorForm">

            <input
                    type="hidden"
                    id="assignDepartmentPublicId">

            <div class="form-group">

                <label for="headDoctorSelect">

                    Head Doctor

                </label>

                <select id="headDoctorSelect" required>

                    <option value="">
                        Select Doctor
                    </option>

                </select>

            </div>

            <div class="modal-footer">

                <button
                        type="button"
                        class="btn btn-secondary"
                        id="cancelAssignBtn">

                    Cancel

                </button>

                <button
                        type="submit"
                        class="btn btn-primary">

                    Assign

                </button>

            </div>

        </form>

    </div>

</div>


<!-- JavaScript -->
<script src="../js/departments.js"></script>

</body>

</html>
