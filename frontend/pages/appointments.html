<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Appointments | Hospital Management System</title>

    <link rel="stylesheet" href="../css/appointments.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">

            <i class="fa-solid fa-hospital"></i>

            <h2>Hospital<br>Management</h2>

        </div>

        <ul>

            <li>

                <a href="dashboard.html">

                    <i class="fa-solid fa-house"></i>

                    Dashboard

                </a>

            </li>

            <li>

                <a href="patients.html">

                    <i class="fa-solid fa-user-injured"></i>

                    Patients

                </a>

            </li>

            <li>

                <a href="doctors.html">

                    <i class="fa-solid fa-user-doctor"></i>

                    Doctors

                </a>

            </li>

            <li>

                <a href="departments.html">

                    <i class="fa-solid fa-building"></i>

                    Departments

                </a>

            </li>

            <li class="active">

                <a href="appointments.html">

                    <i class="fa-solid fa-calendar-check"></i>

                    Appointments

                </a>

            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <!-- Header -->

        <header class="header">

            <div>

                <h1>Appointments</h1>

                <p>Hospital Management System / Appointments</p>

            </div>

            <div class="profile">

                <i class="fa-solid fa-bell"></i>

                <div class="admin">

                    <i class="fa-solid fa-circle-user"></i>

                    <span>Admin</span>

                </div>

            </div>

        </header>

        <!-- Appointment Card -->

        <section class="patient-card">

            <div class="top-bar">

                <div class="search-box">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <input
                            type="text"
                            id="searchAppointment"
                            placeholder="Search by Patient, Doctor or Public ID">

                </div>

                <button
                        id="addAppointmentBtn"
                        class="add-btn">

                    <i class="fa-solid fa-plus"></i>

                    Book Appointment

                </button>

            </div>

            <!-- Table -->

            <div class="table-container">

                <table>

                    <thead>

                    <tr>

                        <th>Public ID</th>

                        <th>Patient</th>

                        <th>Doctor</th>

                        <th>Appointment Time</th>

                        <th>Reason</th>

                        <th>Actions</th>

                    </tr>

                    </thead>

                    <tbody id="appointmentTableBody">

                    <!-- Loaded by JavaScript -->

                    </tbody>

                </table>

            </div>

            <div class="table-footer">

                <p id="appointmentCount">

                    Showing 0 Appointments

                </p>

                <div class="pagination">

                    <button class="page-btn">

                        <i class="fa-solid fa-angle-left"></i>

                    </button>

                    <button class="page-btn active">

                        1

                    </button>

                    <button class="page-btn">

                        <i class="fa-solid fa-angle-right"></i>

                    </button>

                </div>

            </div>

        </section>

    </main>

</div>
<!-- Appointment Modal -->
<div class="modal" id="appointmentModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2 id="modalTitle">Book Appointment</h2>

            <button
                    class="close-btn"
                    id="closeModal">

                <i class="fa-solid fa-xmark"></i>

            </button>

        </div>

        <form id="appointmentForm">

            <input
                    type="hidden"
                    id="appointmentPublicId">

            <div class="form-group">

                <label for="patientPublicId">

                    Patient Public ID

                </label>

                <input
                        type="text"
                        id="patientPublicId"
                        placeholder="Enter Patient Public ID"
                        required>

            </div>

            <div class="form-group">

                <label for="doctorPublicId">

                    Doctor Public ID

                </label>

                <input
                        type="text"
                        id="doctorPublicId"
                        placeholder="Enter Doctor Public ID"
                        required>

            </div>

            <div class="form-group">

                <label for="appointmentTime">

                    Appointment Date & Time

                </label>

                <input
                        type="datetime-local"
                        id="appointmentTime"
                        required>

            </div>

            <div class="form-group">

                <label for="appointmentReason">

                    Reason

                </label>

                <textarea
                        id="appointmentReason"
                        rows="4"
                        placeholder="Enter appointment reason"
                        required></textarea>

            </div>

            <div class="modal-footer">

                <button
                        type="button"
                        class="btn btn-secondary"
                        id="cancelBtn">

                    Cancel

                </button>

                <button
                        type="submit"
                        class="btn btn-primary"
                        id="saveAppointmentBtn">

                    Save Appointment

                </button>

            </div>

        </form>

    </div>

</div>

<!-- JavaScript -->
<script src="../js/appointments.js"></script>

</body>
</html>
